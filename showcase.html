<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Зөвхөн Түүнд Kids Book — Жишээ зургууд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<style>
  .showcase-main { max-width: 1100px; }
  .showcase-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    margin-top: 30px;
  }
  .showcase-card {
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 10px 10px 14px;
    box-shadow: var(--shadow-soft);
    text-align: center;
  }
  .showcase-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    background: var(--cream-2);
  }
  .showcase-card figcaption {
    margin-top: 8px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--plum);
  }
  .showcase-empty, .showcase-loading, .showcase-error {
    text-align: center;
    padding: 60px 20px;
    color: var(--plum-soft);
  }
  .back-link {
    display: inline-block;
    margin-top: 8px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    color: var(--coral);
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="sky">
  <span class="star s1">✦</span>
  <span class="star s2">✧</span>
  <span class="star s3">✦</span>
  <span class="star s4">✧</span>
  <span class="star s5">✦</span>
</div>

<header class="topbar">
  <div class="logo">Зөвхөн <span>Түүнд</span> <small>kids book</small></div>
</header>

<main class="showcase-main">
  <section class="hero">
    <p class="eyebrow">Бусад хүүхдүүд</p>
    <h1>Өмнө нь <em>үүссэн зургууд</em></h1>
    <p class="hero-sub">Бусад захиалагчдын хүүхдүүд ямар үлгэрийн дүр болсныг эндээс харж, урам аваарай.</p>
    <a class="back-link" href="/">← Өөрийн хүүхдийнхээ зургийг оруулах</a>
  </section>

  <div id="showcaseLoading" class="showcase-loading">Ачааллаж байна…</div>
  <div id="showcaseEmpty" class="showcase-empty" hidden>Одоогоор жишээ зураг алга.</div>
  <div id="showcaseError" class="showcase-error" hidden></div>
  <div id="showcaseGrid" class="showcase-grid"></div>
</main>

<footer>
  <p>Зөвхөн Түүнд Kids Book</p>
</footer>

<script>
const grid = document.getElementById("showcaseGrid");
const loadingEl = document.getElementById("showcaseLoading");
const emptyEl = document.getElementById("showcaseEmpty");
const errorEl = document.getElementById("showcaseError");

async function loadShowcase() {
  try {
    const res = await fetch("/.netlify/functions/showcase-list");
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Тодорхойгүй алдаа гарлаа.");
    }

    loadingEl.hidden = true;

    if (!data.items || data.items.length === 0) {
      emptyEl.hidden = false;
      return;
    }

    data.items.forEach((item) => {
      const card = document.createElement("figure");
      card.className = "showcase-card";

      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = `/.netlify/functions/showcase-image?id=${encodeURIComponent(item.id)}`;
      img.alt = item.childName || "жишээ зураг";

      const caption = document.createElement("figcaption");
      caption.textContent = item.childName || "(нэргүй)";

      card.appendChild(img);
      card.appendChild(caption);
      grid.appendChild(card);
    });
  } catch (err) {
    loadingEl.hidden = true;
    errorEl.hidden = false;
    errorEl.textContent = `Алдаа гарлаа: ${err.message}`;
  }
}

loadShowcase();
</script>
</body>
</html>
